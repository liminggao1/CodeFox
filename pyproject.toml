[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codefox"
version = "0.1.0"
description = "CodeFox: local coding agent with tools, subagents, workflows, and goals"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.25.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
tui = ["textual>=8.2.8,<9"]

[project.scripts]
codefox = "codefox.frontends.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
codefox = ["skills/*/*", "skills/*/*/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
